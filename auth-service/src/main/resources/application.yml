server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: auth-service
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  datasource:
    url: jdbc:postgresql://localhost:5432/healthcare_db
    username: postgres
    password: healthcare_secure_password_123
    driver-class-name: org.postgresql.Driver
  security:
    user:
      name: admin
      password: admin123

jwt:
  secret: 9xWb4pQ6zM2vE7rK5tY8uB3nC6mQ1wZ4vX7pL0kR3jH6fG9sD2aF5gH8jK1lM3nO
  expiration: 900000
  refresh:
    expiration: 2592000000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.healthcare: DEBUG
    org.springframework.web: INFO

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/healthcare_db
    username: postgres
    password: healthcare_secure_password_123
