server:
  port: 8084
  servlet:
    context-path: /

spring:
  application:
    name: billing-service
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: jdbc:postgresql://localhost:5432/healthcare_db
    username: healthcare_user
    password: healthcare_secure_password_123
    driver-class-name: org.postgresql.Driver

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.healthcare: DEBUG

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/healthcare_db
    username: healthcare_user
    password: healthcare_secure_password_123
